<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Natural BD Extra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

    <!-- অ্যাডমিন হেডার -->
    <header class="main-header">
        <div class="logo-area">
            <h1>Natural BD Extra</h1>
            <p>🔒 সিক্রেট অ্যাডমিন ড্যাশবোর্ড</p>
        </div>
        <div class="action-buttons">
            <a href="index.html" class="cart-btn">⬅️ ওয়েবসাইটে ফিরে যান</a>
        </div>
    </header>

    <!-- পাসওয়ার্ড প্রটেক্টেড সেকশন -->
    <div class="admin-container" id="loginBox">
        <div class="login-card">
            <h2>অ্যাডমিন লগইন</h2>
            <p>দয়া করে সিক্রেট পাসওয়ার্ড দিন:</p>
            <input type="password" id="adminPass" placeholder="পাসওয়ার্ড দিন...">
            <button onclick="checkPassword()">লগইন করুন</button>
        </div>
    </div>

    <!-- ড্যাশবোর্ড কন্টেন্ট (লগইন সফল হলে দেখাবে) -->
    <div class="admin-dashboard" id="dashboardBox" style="display: none;">
        <h2>পণ্য ও ক্যাটালগ ম্যানেজমেন্ট</h2>
        
        <div class="admin-form-group">
            <h3>নতুন পণ্য যোগ করুন</h3>
            <input type="text" id="newProdName" placeholder="পণ্যের নাম (যেমন: অর্গানিক ঘি)">
            <input type="number" id="newProdPrice" placeholder="মূল্য (টাকা)">
            <input type="text" id="newProdImg" placeholder="ছবির লিংক (Image URL)">
            <button onclick="addNewProduct()">পণ্য লিস্টে যুক্ত করুন</button>
        </div>

        <div class="admin-form-group">
            <h3>পণ্য ডিলিট বা এডিট করুন</h3>
            <input type="text" id="delProdName" placeholder="ডিলিট করতে চান এমন পণ্যের নাম">
            <button onclick="deleteProduct()" class="delete-btn">পণ্য মুছে ফেলুন</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
