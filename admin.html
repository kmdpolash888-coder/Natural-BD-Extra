<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Natural BD Extra</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">

    <header class="site-header">
        <div class="logo">
            <h2>Natural BD Extra - Admin</h2>
        </div>
        <div class="header-right">
            <a href="index.html" class="btn-primary" style="padding: 6px 12px; font-size: 13px;">ওয়েবসাইটে যান</a>
        </div>
    </header>

    <div class="admin-container" id="loginBox">
        <div class="login-card">
            <h2><i class="fa-solid fa-lock"></i> অ্যাডমিন লগইন</h2>
            <p>সিক্রেট পাসওয়ার্ড দিন:</p>
            <input type="password" id="adminPass" placeholder="পাসওয়ার্ড (admin123)">
            <button onclick="checkPassword()">লগইন করুন</button>
        </div>
    </div>

    <div class="admin-dashboard" id="dashboardBox" style="display: none;">
        <h2><i class="fa-solid fa-gauge"></i> ড্যাশবোর্ড ও প্রোডাক্ট ম্যানেজমেন্ট</h2>
        
        <div class="admin-form-group">
            <h3>নতুন পণ্য যোগ করুন</h3>
            <input type="text" id="newProdName" placeholder="পণ্যের নাম">
            <input type="number" id="newProdPrice" placeholder="মূল্য (টাকা)">
            <button onclick="addNewProduct()">পণ্য যুক্ত করুন</button>
        </div>

        <div class="admin-form-group">
            <h3>পণ্য ডিলিট করুন</h3>
            <input type="text" id="delProdName" placeholder="মুছে ফেলতে চান এমন পণ্যের নাম">
            <button onclick="deleteProduct()" class="delete-btn">পণ্য ডিলিট করুন</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
