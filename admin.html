<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Natural BD Extra</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">
    <header class="site-header">
        <div class="logo">
            <h2>Natural BD Extra - Admin</h2>
        </div>
        <div class="header-right">
            <a href="index.html" class="btn-primary" style="padding: 6px 12px; font-size: 13px; background:#d81b60; color:#fff; text-decoration:none; border-radius:4px;">ওয়েবসাইটে যান</a>
        </div>
    </header>

    <div class="admin-dashboard" style="max-width: 500px; margin: 40px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <h2><i class="fa-solid fa-upload"></i> পণ্য আপলোড প্যানেল</h2>
        <p>যেকোনো সাইজের ছবি আপলোড করতে পারবেন:</p>
        <div class="admin-form-group" style="margin-top: 15px;">
            <input type="text" id="pName" placeholder="পণ্যের নাম" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:4px;">
            <input type="text" id="pPrice" placeholder="মূল্য (যেমন: ৳ ১,২০০)" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:4px;">
            <input type="file" id="pImage" accept="image/*" style="width:100%; margin-bottom:10px;">
            <button onclick="uploadProductDirect()" style="width:100%; background:#265336; color:white; border:none; padding:10px; border-radius:4px; font-weight:bold; cursor:pointer;">পাবলিশ করুন</button>
        </div>
    </div>
</body>
</html>
